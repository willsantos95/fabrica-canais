# Fábrica de Canais — servidor (EasyPanel / Hostinger)
# API do worker + fila Redis + MinIO + 1 worker de render.
# Postgres: use o que já existe no EasyPanel (rode db/migrations/*.sql nele).

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    # Para workers no seu PC (README, "Workers no seu PC"): REDIS_BIND = IP da
    # Tailscale do servidor (100.x.y.z). Padrão 127.0.0.1 = fila fechada para fora.
    # REDIS_PORT muda a porta no servidor se a 6379 já estiver em uso.
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  # A imagem oficial minio/minio saiu do Docker Hub (set/2026). Usamos o build
  # da Chainguard, que roda como usuário 65532; o minio-init ajusta o dono do volume.
  minio-init:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - minio-data:/data
    restart: "no"

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: ../worker
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on: [redis, minio]
    restart: unless-stopped

  render:
    build: ../worker
    # nome "srv-<container>" para distinguir dos workers do PC ("pc-<container>") nos logs e em /workers
    command: ["sh", "-c", "exec rq worker render --url redis://:$$REDIS_PASSWORD@redis:6379/0 --with-scheduler --name srv-$$HOSTNAME"]
    environment:
      S3_ENDPOINT: http://minio:9000
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    env_file: .env
    volumes:
      - work:/data/work
      - models:/data/models
    healthcheck:
      disable: true
    depends_on: [redis, minio]
    restart: unless-stopped
    deploy:
      replicas: ${RENDER_REPLICAS:-1}

volumes:
  redis-data:
  minio-data:
  work:
  models:
